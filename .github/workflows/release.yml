name: Release installers

# Build the desktop app for each OS, then publish them to the GitHub Release in
# one step. Triggered by pushing a version tag (e.g. `npm version patch && git
# push --follow-tags`).
on:
  push:
    tags: ['v*']

permissions:
  contents: write # publish the Release

# Actions are pinned to full commit SHAs (tag in the comment), so a moved or
# hijacked tag can't change what runs with this workflow's write token. To
# update one, resolve the new tag with `git ls-remote <repo> refs/tags/<tag>`.
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ''
          - os: ubuntu-latest
            args: ''
          # The Mac build runs on an Intel runner and makes both an Apple
          # Silicon and an Intel .dmg. macos-latest is Apple Silicon only, and
          # v0.6.1 never got one ("not acquired by Runner ... after multiple
          # attempts", arm64 capacity), which blocked the whole release.
          - os: macos-15-intel
            args: '--mac --arm64 --x64'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - run: npm ci

      # Builds are UNSIGNED. Do NOT set CSC_LINK / APPLE_* here as empty values —
      # empty signing vars make electron-builder attempt (and fail) signing on
      # macOS. When you have certificates, add them as repo secrets and a guarded
      # env block (see BUILD.md); until then, leave signing off entirely.
      #
      # --publish never: on a tag push electron-builder otherwise defaults to
      # `--publish onTagOrDraft` and tries to upload to GitHub, which fails for
      # lack of a GH_TOKEN. Publishing is done once by the `release` job below.
      - name: Build installers
        run: npm run dist -- --publish never ${{ matrix.args }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers-${{ matrix.os }}
          if-no-files-found: ignore
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.blockmap
            dist/*.yml

  # Publish once, after the builds — avoids 3 jobs racing to create the Release.
  # Runs even if one platform failed, so a stuck runner on one OS can't hold
  # back the others; the job summary says which platforms are missing.
  release:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true

      - name: Check what was built
        run: |
          ls -la artifacts || true
          missing=""
          ls artifacts/*.exe >/dev/null 2>&1 || missing="$missing Windows"
          ls artifacts/*.dmg >/dev/null 2>&1 || missing="$missing macOS"
          ls artifacts/*.AppImage >/dev/null 2>&1 || missing="$missing Linux"
          if [ -z "$(ls -A artifacts 2>/dev/null)" ]; then
            echo "::error::No installers were built; nothing to publish."
            exit 1
          fi
          if [ -n "$missing" ]; then
            echo "::warning::Published without:$missing. Re-run the failed build job(s), then re-run this job to add them."
            echo "### Missing installers:$missing" >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: artifacts/**
